<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yard Dog: Fence &amp; Deck Supply Tycoon</title>
<style>
:root{--bg:#0e1f1a;--panel:#163a30;--panel2:#1e4a3d;--glass:rgba(16,44,36,.80);--line:#2e6652;--txt:#f3fbf6;--mut:#a3c9b8;--acc:#ffb526;--acc2:#4fd1a5;--good:#3ee08f;--warn:#ffd23f;--bad:#ff5d73;--sales:#ff7a5c;--product:#3fd7ff;--service:#46e08a;--ops:#ffc93c;--logistics:#ff6ad5;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 30%,#2f6b55 0%,#163a30 45%,#08140f 100%) fixed;color:var(--txt);font:15px/1.4 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
h1{font-size:26px;margin:0 0 6px;font-weight:900}h2{margin:0 0 10px;font-size:19px;font-weight:900}h3{margin:16px 0 7px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.mut{color:var(--mut)}.small{font-size:12.5px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
/* ---------- layout ---------- */
#officeWrap{position:fixed;inset:0;z-index:0}
#office,#office3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:fixed;top:0;left:0;right:0;z-index:12;padding:10px 10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(140,210,180,.22);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;color:var(--txt);border:0}
.brand b{display:block;font-size:13.5px;line-height:1.1;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand small{color:var(--mut);font-size:11.5px;font-weight:700}
.res{display:flex;gap:4px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none}.res::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-weight:900;font-size:13px;white-space:nowrap}
.pill.m{color:var(--good)}.pill.neg{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{background:rgba(255,93,115,.25)}}
.spd{display:flex;gap:2px;padding:4px;border-radius:999px;margin-left:auto}
@media(max-width:620px){.res{order:3;width:100%;justify-content:space-between}.brand b{max-width:120px}.spd button{padding:5px 8px}}
.spd button{background:none;border:0;color:var(--mut);border-radius:999px;padding:5px 10px;font-weight:900;font-size:12px;transition:background .2s,color .2s}
.spd button.on{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#2a1600;box-shadow:0 2px 0 #b86a00}
#float{position:fixed;z-index:4;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#float>*{pointer-events:auto}
.fcard{border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:10px;animation:drop .35s cubic-bezier(.2,.9,.3,1.2) both}
.fcard b{font-size:13.5px}.fcard .bar{flex:1}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#toast{position:fixed;z-index:4;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.2);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;max-width:calc(100% - 30px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#dock{position:fixed;z-index:12;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:flex-end;gap:4px;padding:8px 10px;border-radius:26px;width:min(520px,calc(100% - 20px));justify-content:space-around}
.dk{position:relative;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:800;padding:2px 4px;min-width:46px;transition:transform .15s,color .2s}
.dk span{font-size:22px;line-height:1.15;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.dk.on{color:var(--acc)}.dk:active{transform:scale(.92)}
.dk.fab span{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:linear-gradient(180deg,#ffd166,#ff9f1c);box-shadow:0 5px 0 #b86a00,0 10px 20px rgba(255,159,28,.45);border:3px solid #fff3d6}
.dk.fab{color:var(--acc)}
.dk i{position:absolute;top:-4px;right:6px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:900;border-radius:99px;padding:1px 6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dk.fab i{top:-30px;right:2px}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(4,14,10,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
main#main{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;height:calc(100dvh - 64px);background:linear-gradient(180deg,rgba(24,62,50,.97),rgba(14,38,30,.98));border:1px solid rgba(140,210,180,.25);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);overflow-y:auto;overscroll-behavior:contain;padding:0 14px 120px;scrollbar-width:thin}
main#main.open{transform:none}
.shead{position:sticky;top:0;z-index:3;margin:0 -14px 12px;padding:10px 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(24,62,50,1) 70%,rgba(24,62,50,0));}
.shead::before{content:"";position:absolute;top:6px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:rgba(255,255,255,.25)}
.shead h2{margin:10px 0 0;flex:1;font-size:21px}
.xbtn{margin-top:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;font-weight:900}
body.setup{overflow:auto}
body.setup #hud,body.setup #dock,body.setup #float,body.setup #officeWrap,body.setup #scrim,body.setup #toast{display:none}
body.setup main#main{position:static;transform:none;height:auto;background:none;border:0;box-shadow:none;padding:16px 14px 40px;overflow:visible}
/* ---------- components ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(140,210,180,.18);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#2a1600;border:0;border-radius:14px;padding:10px 16px;font-weight:900;box-shadow:0 4px 0 #b86a00,0 8px 16px rgba(255,159,28,.25);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b86a00}
.btn.sec{background:linear-gradient(180deg,#2a5c4c,#1e4a3d);color:var(--txt);box-shadow:0 4px 0 #0f2c24}
.btn.sec:active{box-shadow:0 1px 0 #0f2c24}
.btn.good{background:linear-gradient(180deg,#6ff5ae,#22c47a);color:#05301a;box-shadow:0 4px 0 #128452}
.btn.bad{background:linear-gradient(180deg,#ff8a9a,#f2405c);color:#fff;box-shadow:0 4px 0 #a51f37}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:11px;box-shadow:0 3px 0 #b86a00}
.btn.sec.sm{box-shadow:0 3px 0 #0f2c24}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.opt{background:linear-gradient(180deg,#245446,#1c463a);border:2px solid transparent;border-radius:15px;padding:11px 8px;text-align:center;font-weight:800;font-size:13px;color:var(--txt);box-shadow:0 4px 0 #0d2a22;transition:transform .08s,box-shadow .08s,border-color .2s,background .2s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0d2a22}
.opt.on{border-color:var(--acc);background:linear-gradient(180deg,#2f7a5f,#256a50);box-shadow:0 4px 0 #b86a00,0 0 0 3px rgba(255,181,38,.18)}
.opt:disabled{opacity:.32}
.opt small{display:block;color:var(--mut);font-weight:600;font-size:11px;margin-top:3px}
input[type=text],select{background:#10302a;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 5px;border-bottom:1px solid rgba(140,210,180,.15);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.bar{height:10px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9f1c);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog{height:14px}
.slider-row{display:grid;grid-template-columns:68px 36px 1fr 36px 52px 40px;gap:6px;align-items:center;margin:9px 0}
.slider-row .pct{font-weight:900;text-align:center}
.pm{width:36px;height:36px;border-radius:12px;border:0;background:linear-gradient(180deg,#2a5c4c,#1e4a3d);color:var(--txt);font-weight:900;font-size:18px;box-shadow:0 3px 0 #0d2a22}
.pm:active{transform:translateY(2px);box-shadow:none}.pm:disabled{opacity:.3}
.hint{font-weight:900;text-align:center;font-size:13px;color:var(--acc)}
.cat{border-left:4px solid;padding:10px 12px;margin:9px 0;background:rgba(255,255,255,.04);border-radius:14px}
.star-row{display:grid;grid-template-columns:1fr 32px 104px 32px;gap:6px;align-items:center;margin:5px 0;font-size:13px}
.stars{letter-spacing:1px;color:#ffd447;font-size:16px;text-align:center;text-shadow:0 1px 4px rgba(255,200,0,.4)}
.stars .off{color:#2e5a4c;text-shadow:none}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(255,255,255,.07);border:1px solid rgba(140,210,180,.2);margin:2px}
.trait{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(79,209,165,.22);border:1px solid rgba(79,209,165,.6);color:#d8fbe9;margin:2px}
.P{color:var(--good)}.G{color:#b7f05a}.A{color:var(--warn)}.X{color:var(--bad)}
.imp3{color:var(--good)}.imp2{color:#c9f25a}.imp1{color:#ff8a5c}
.news{font-size:13px;padding:7px 0;border-bottom:1px dashed rgba(140,210,180,.2)}.news span{color:var(--mut);margin-right:6px;font-weight:700}
.av{display:inline-block;vertical-align:middle}
.staff{display:flex;gap:11px;align-items:center;padding:11px;background:rgba(255,255,255,.045);border:1px solid rgba(140,210,180,.14);border-radius:16px;margin-bottom:9px;transition:transform .12s,background .2s}
.staff:active{transform:scale(.985)}
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11px;text-align:center;flex:1}
.skills div b{display:block;font-size:14px}
.meter{height:7px;background:rgba(0,0,0,.35);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;border-radius:9px;transition:width .5s}
.mrow{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center;font-size:11px;margin-top:4px}
.score{display:inline-block;background:linear-gradient(180deg,#ff6f91,#ff2f5f);color:#fff;font-weight:900;border-radius:16px;padding:8px 16px;font-size:30px;box-shadow:0 5px 0 #a3163a}
.rev{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(140,210,180,.15)}
.rev .s{background:linear-gradient(180deg,#ff6f91,#ff2f5f);color:#fff;font-weight:900;border-radius:10px;padding:5px 8px;min-width:46px;text-align:center}
.pos{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#ff5d73,#ffd23f 30%,#3ee08f 50%,#ffd23f 70%,#ff5d73)}
.pos i{position:absolute;top:-4px;width:7px;height:18px;background:#fff;border-radius:4px;transform:translateX(-3px);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps span{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.1);transition:background .3s}.steps span.on{background:linear-gradient(90deg,#ffd166,#ff9f1c)}
.trend{background:linear-gradient(120deg,rgba(79,209,165,.35),rgba(255,107,180,.25));border-color:rgba(160,230,200,.5)}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s}
.swatch.on{border-color:#fff;transform:scale(1.12)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:1px solid rgba(140,210,180,.22);border-radius:20px;padding:12px 8px 10px;text-align:center;color:var(--txt);background:linear-gradient(180deg,#24574a,#1a4337);box-shadow:0 5px 0 #0c271f,0 10px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #0c271f}
.tile .ti{font-size:30px;line-height:1.25;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}.tile b{font-size:13px}.tile small{color:var(--mut);font-size:10.5px;line-height:1.25}
.tile .badge{position:absolute;top:-6px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-weight:900;font-size:11px;border-radius:99px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
select.lead{width:auto;max-width:200px;padding:5px 8px;font-size:12px;border-radius:10px}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;background:rgba(4,14,10,0);transition:background .2s}
#modal.open{background:rgba(4,14,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal .box{background:linear-gradient(180deg,#24574a,#163a30);border:1px solid rgba(160,230,200,.3);border-radius:26px;max-width:600px;width:100%;padding:18px;margin:auto;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);transform:translateY(30px) scale(.94);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.25),opacity .2s}
#modal.open .box{transform:none;opacity:1}
#mbox .btn{line-height:1.25}
main.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.avprev{position:sticky;top:76px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 -15px;padding:10px 0 12px;background:linear-gradient(180deg,rgba(22,58,46,.97) 80%,rgba(22,58,46,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px}
body.setup .avprev{top:0}
.proj{background:rgba(255,255,255,.045);border:1px solid rgba(140,210,180,.16);border-radius:16px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
.faces{display:flex;gap:2px;flex-wrap:wrap;min-height:26px;align-items:center}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(140,210,180,.12)}
.arow select.lead{max-width:150px;font-size:12px}
.mini{height:4px;background:rgba(0,0,0,.35);border-radius:9px;overflow:hidden;margin-top:4px;max-width:120px}.mini i{display:block;height:100%}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile.sm{min-height:70px;padding:8px 4px}.tile.sm .ti{font-size:22px}.tile.sm b{font-size:11.5px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,.25);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);font-weight:800;font-size:12.5px;padding:8px 10px;border-radius:12px;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(180deg,#ffd166,#ff9f1c);color:#2a1600;box-shadow:0 2px 0 #b86a00}
.sec{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(140,210,180,.18);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sec summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 15px;font-size:15px}
.sec summary::-webkit-details-marker{display:none}.sec summary::after{content:'›';font-size:22px;color:var(--mut);transition:transform .2s;margin-left:4px}.sec[open] summary::after{transform:rotate(90deg)}
.sec summary span{margin-left:auto;text-align:right}.secb{padding:0 12px 6px}.secb>.card{background:rgba(0,0,0,.12)}
.hero{text-align:center;padding:26px 14px;background:linear-gradient(135deg,rgba(255,181,38,.2),rgba(79,209,165,.25))}
.hero h1{font-size:34px;background:linear-gradient(180deg,#fff,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent}

#tut{position:fixed;inset:0;z-index:40;display:none}
#tut.on{display:block}
#tut .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,14,10,.78);border:2px solid var(--acc);transition:all .35s cubic-bezier(.2,.9,.3,1.1);pointer-events:none;animation:tutpulse 1.6s ease-in-out infinite}
#tut .hole.none{box-shadow:0 0 0 9999px rgba(4,14,10,.78);border:none;width:0!important;height:0!important;animation:none}
@keyframes tutpulse{50%{border-color:#ffe08a;outline:4px solid rgba(255,181,38,.25)}}
#tut .tb{position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));background:linear-gradient(180deg,#24574a,#183f33);border:1px solid #3a8a6c;border-radius:20px;padding:16px 16px 14px;box-shadow:0 20px 50px rgba(0,0,0,.55);color:var(--txt);transition:top .35s cubic-bezier(.2,.9,.3,1.1)}
#tut .tb h3{margin:0 0 6px;font-size:19px}#tut .tb p{margin:0 0 6px;font-size:14.5px;line-height:1.45;color:#e2f6ec}
#tut .tb ul{margin:4px 0 6px;padding-left:18px;font-size:14px;line-height:1.5;color:#e2f6ec}
#tut .tbf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
#tut .dots{display:flex;gap:4px}#tut .dots i{width:7px;height:7px;border-radius:50%;background:#3a8a6c}#tut .dots i.on{background:var(--acc)}
#tut .skip{background:none;border:none;color:var(--mut);font-size:13px;font-weight:700;padding:6px}
.tip{border:1px solid rgba(255,181,38,.45)!important;background:linear-gradient(180deg,rgba(255,181,38,.14),rgba(255,181,38,.05))!important;font-size:14px;line-height:1.45}
.tip b.h{color:var(--acc)}
/* founder creation */
.fsteps{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.fsteps::-webkit-scrollbar{display:none}
.stp{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);border-radius:99px;padding:6px 11px;font-weight:800;font-size:12px}
.stp.on{background:var(--acc);color:#2a1600;border-color:var(--acc)}
.stp.done{color:var(--txt);border-color:var(--acc2)}
.wnav{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,26,21,0),#0b1a15 40%);z-index:7}
.wnav .btn{flex:1;padding:13px 10px;font-size:15px}
.wnav .btn.sec{flex:0 0 auto;padding:13px 16px}
.btn.go{background:linear-gradient(180deg,#5cf0a6,#24a868);color:#062014;box-shadow:0 4px 0 #136a40,0 8px 16px rgba(62,224,143,.25)}

function logoSvg(f,size){const L=f.logo||{e:'🪵',c:0,sh:'shield'};const c=LOGOC[L.c%LOGOC.length];const id='lg'+L.c+L.sh;
 const d={shield:'M50 4L92 18V50C92 74 72 90 50 98C28 90 8 74 8 50V18Z',circle:'M50 4A46 46 0 1 1 50 96A46 46 0 1 1 50 4Z',badge:'M18 4H82Q96 4 96 18V82Q96 96 82 96H18Q4 96 4 82V18Q4 4 18 4Z',hex:'M50 3L93 27V73L50 97L7 73V27Z'}[L.sh]||'';
 return `<svg class="logo" viewBox="0 0 100 100" width="${size}" height="${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,1.3)}"/><stop offset="1" stop-color="${shade(c,0.7)}"/></linearGradient></defs><path d="${d}" fill="url(#${id})" stroke="${shade(c,0.45)}" stroke-width="3"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" transform="translate(50 50) scale(.84) translate(-50 -50)"/><text x="50" y="${L.sh==='shield'?52:54}" font-size="42" text-anchor="middle" dominant-baseline="middle">${L.e}</text></svg>`}
function radar(sk,size){const n=CATS.length,R=44;const mx=Math.max(160,...CATS.map(c=>sk[c.k]));const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [60+Math.cos(a)*R*v,60+Math.sin(a)*R*v]};
 const ring=v=>CATS.map((_,i)=>pt(i,v).map(z=>z.toFixed(1)).join(',')).join(' ');const P=CATS.map((c,i)=>pt(i,Math.min(1,sk[c.k]/mx)));
 return `<svg class="radar" viewBox="-14 -4 148 128" width="${size}" height="${Math.round(size*128/148)}">${[0.25,0.5,0.75,1].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="rgba(255,255,255,.13)"/>`).join('')}${CATS.map((c,i)=>{const [x,y]=pt(i,1);return `<line x1="60" y1="60" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.1)"/>`}).join('')}<polygon points="${P.map(p=>p.map(z=>z.toFixed(1)).join(',')).join(' ')}" fill="rgba(255,181,38,.28)" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>${P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--${CATS[i].k})"/>`).join('')}${CATS.map((c,i)=>{const [x,y]=pt(i,1.24);return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="8.5" font-weight="800" fill="var(--${c.k})" text-anchor="middle" dominant-baseline="middle">${c.n}</text>`}).join('')}</svg>`}
function seasonChart(R){const a=(R.fx||{}).sea||1;const v=SEAS.map(s=>Math.max(0.15,1+(s-1)*a));const mx=1.6;
 return `<svg viewBox="0 0 240 70" width="100%" height="80" style="max-width:420px">${v.map((x,i)=>{const h=x/mx*52;return `<rect x="${i*20+3}" y="${56-h}" width="14" height="${h}" rx="3" fill="${x>=1.1?'var(--good)':x<0.6?'#5aa0ff':'var(--acc)'}" opacity=".85"/><text x="${i*20+10}" y="67" font-size="7" fill="var(--mut)" text-anchor="middle">${MONTHS[i][0]}</text>`}).join('')}</svg><p class="mut small" style="margin:2px 0 0">Peak season runs ${Math.round(Math.max(...v)*100)}% of normal. Deep winter drops to ${Math.round(Math.min(...v)*100)}%.</p>`}
function founderBio(o){const P=PRON[o.pron||'they']||PRON.they;const bg=BACKGROUNDS.find(b=>b.k===o.bg),fu=FUNDS.find(x=>x.k===o.fund),A=AMBS.find(a=>a.k===o.amb),R=REGIONS.find(r=>r.k===o.region);
 const nm=!o.name||o.name==='You'?'Our founder':o.name.split(' ')[0];let t=`${nm} grew up in ${o.town||'a small town'}${R?' ('+R.n+')':''}. ${bg?bg.bio+'.':''} ${fu?fu.story.replace(/^They/,P[3]):''}`;

function perkList(o){const a=ARCH.find(x=>x.k===o.arch)||ARCH[0],bg=BACKGROUNDS.find(b=>b.k===o.bg)||{},R=REGIONS.find(r=>r.k===o.region),fo=FOCUS.find(x=>x.k===o.focus),fu=FUNDS.find(x=>x.k===o.fund),A=AMBS.find(x=>x.k===o.amb),cp=COMPS.find(x=>x.k===o.comp);const ag=o.age||32;
 const L=[[`🎯`,`<b>${a.n}</b>: ${a.m?'+15 '+CATS.find(c=>c.k===a.m).n:'+5 all skills, +$100K'} · ${TRAITS[ARCH_T[a.k]][0]}`],[bg.ic||'📖',`<b>${bg.n}</b>: ${bg.d}. ${bg.p||''}`]];
 if(R)L.push([R.ic,`<b>${R.n}</b>: ${R.tags.join(' · ')}`]);if(fo)L.push([fo.ic,`<b>${fo.n}</b>: ${fo.d}`]);if(fu)L.push([fu.ic,`<b>${fu.n}</b>: ${fu.d}`]);
 if(cp&&cp.k!=='none')L.push([cp.ic,`<b>${cp.n}</b> joins: ${cp.d}`]);if(o.nem)L.push(['😤',`<b>Rival: ${esc(o.nem)}</b>. They bid ${(o.flaws||[]).includes('grudge')?'much ':''}tougher, but every job you take from them earns extra reputation.`]);
 if(A)L.push([A.ic,`<b>Dream: ${A.n}</b>. ${A.perk}`]);L.push(['🎂',`<b>Age ${ag}</b>: ${ageNote(ag)}`]);(o.flaws||[]).forEach(k=>L.push(['⚠️',`<b class="bad">${FLAWS[k][0]}</b>: ${FLAWS[k][1]}`]));
 return `<ul class="perks">${L.map(([i,t])=>`<li><span>${i}</span><span>${t}</span></li>`).join('')}</ul>`}
const ageNote=a=>`${a<25?'Young and hungry':a<40?'In your prime':a<55?'Seasoned':'Old pro'}. ${ageBonus(a)?'+'+ageBonus(a)+' skill points from experience. ':''}Learns ${ageLearn(a).toFixed(2)}× as fast${a>=55?'. Tires 12% faster':''}.`;

function setDefaults(){SET={step:0,name:'',nick:'',pron:'he',studio:'',arch:'sales',bg:'installer',traits:['fast','trend'],flaws:[],fav:'wood',age:32,region:'pnw',town:'Spokane',diff:'normal',
 alloc:{sales:30,product:25,service:25,ops:20,logistics:20},logo:{e:'🪵',c:0,sh:'shield'},motto:'Built to last.',focus:'balanced',fund:'savings',comp:'buddy',compP:{},nem:null,nemH:'oldboss',amb:'king',
 av:{skin:2,hc:1,hs:'short',eye:0,beard:'stubble',outfit:'flannel',shirt:4,acc:'cap',freckles:false}}}
const setS=(k,v)=>{SET[k]=v;fixAlloc();render()};
function setStep(i){SET.step=clamp(i,0,FSTEPS.length-1);render();const m=document.getElementById('main');if(m)m.scrollTop=0;try{scrollTo(0,0)}catch(e){}}
function pool(){const bg=BACKGROUNDS.find(b=>b.k===SET.bg)||{},fu=FUNDS.find(x=>x.k===SET.fund)||{};return PTS0+ageBonus(SET.age)+SET.flaws.length*20+(bg.pts||0)+(fu.pts||0)}
const spent=()=>CATS.reduce((a,c)=>a+(SET.alloc[c.k]||0),0);
const ptsLeft=()=>pool()-spent();
function fixAlloc(){let over=spent()-pool();while(over>0){const k=CATS.map(c=>c.k).sort((a,b)=>SET.alloc[b]-SET.alloc[a])[0];const cut=Math.min(over,SET.alloc[k]);if(!cut)break;SET.alloc[k]-=cut;over-=cut}}
function alloc(k,d){const al=SET.alloc[k]||0;if(d>0)d=Math.min(d,ptsLeft(),80-al);SET.alloc[k]=clamp(al+d,0,80);render()}
function allocPreset(m){const p=pool();const ks=CATS.map(c=>c.k);ks.forEach(k=>SET.alloc[k]=0);

function autoBid1(m,lead){if(!S.rfqs.some(r=>!inBid(r.id)))return false;const est=lead;
 const team=[lead.id];const repS=[m,lead].concat(S.staff.filter(x=>x.rk==='rep'&&!x.vac)).sort((a,b)=>(eff(b,'sales')+eff(b,'service'))-(eff(a,'sales')+eff(a,'service')))[0];const sk=clamp(leadOf(m)/200,0.3,1.3);let best=null;
 for(const r of S.rfqs){if(inBid(r.id))continue;const L=LN(r.line),T=CT[r.type];const d={step:3,rfq:r.id,rfqCopy:JSON.parse(JSON.stringify(r)),grade:'std',src:'stock',dlv:(canStage()&&['builder','comm'].includes(r.type))?'staged':'deliver',terms:T.pro?'net30':'cod',m:L.m,ex:S.extras.filter(k=>exFits(k,r)).slice(0,3),team,rep:repS.id,est:est?est.id:m.id};if(has('b_install')&&typeof installCap==='function'&&installCap()>0&&typeof INST_TYPES!=='undefined'&&INST_TYPES.includes(r.type))d.inst=true;
  if(T.spec&&S.extras.includes('spec')&&!d.ex.includes('spec'))d.ex.push('spec');if(prepWeeks(d)>r.close-S.week)continue;

function rpOf(r){return Math.round(r.rp*1.4*(1+S.res.length*0.018)*fx('res_'+r.k))}
function cOf(r){return Math.round(r.c*1.8*(1+S.res.length*0.025)*fx('res_'+r.k)/1000)*1000}
function drillCost(){return 40+(S.drills||0)*25}
function doDrill(c){const k=drillCost();if(S.rp<k)return;S.rp-=k;S.drills=(S.drills||0)+1;S.staff.forEach(s=>s.sk[c]=Math.min(250,s.sk[c]+3));news('🧠 Crew-wide '+CATS.find(x=>x.k===c).n+' clinic: everyone +3');save();render();renderHud()}
function resAvail(r){return !has(r.k)&&(!r.req||r.req.every(has))&&(!r.from||yearOf(S.week)>=r.from)}
function doResearch(k){const r=RES.find(x=>x.k===k);if(!resAvail(r)||S.rp<rpOf(r)||S.money<cOf(r))return;const kp=rpOf(r),cc=cOf(r);S.rp-=kp;spend(cc);S.res.push(k);
 const u=r.u||{};Object.keys(u).forEach(key=>{S[key]=S[key]||[];u[key].forEach(v=>{if(!S[key].includes(v))S[key].push(v)})});
 if(u.lines)u.lines.forEach(l=>{if(!S.tgt[l])S.tgt[l]=20});
 news('🧠 Unlocked '+r.n);save();render();renderHud()}
function rpRate(){return fx('rp')*S.staff.reduce((a,s)=>a+(s.train||s.vac?0.05:(s.task==='research'?0.45+s.iq*0.11:0.12+s.iq*0.035)*(hasT(s,'visionary')?1.5:1)),0)}
function resRow(r){const done=has(r.k);const av=resAvail(r);const lockMsg=done?'':!r.req||r.req.every(has)?(r.from&&yearOf(S.week)<r.from?'Available '+r.from:''):'Requires '+r.req.filter(x=>!has(x)).map(x=>RES.find(y=>y.k===x).n).join(', ');
 return `<div class="between small" style="padding:7px 0;border-bottom:1px solid rgba(140,210,180,.15)"><span style="flex:1"><b>${r.n}</b>${lockMsg?`<br><span class="mut">${lockMsg}</span>`:''}</span>${done?'<span class="good">✓ Done</span>':`<button class="btn sm" ${av&&S.rp>=rpOf(r)&&S.money>=cOf(r)?'':'disabled'} onclick="doResearch('${r.k}')">${rpOf(r)} KP · ${$m(cOf(r))}</button>`}</div>`}

const RTIERS=[['Job board',0,0],['Trade referrals',15e3,1],['Industry recruiter',80e3,2],['Executive search',400e3,3]];
function genCand(t,rk){const R=[[30,70],[60,110],[95,150],[130,195]][t].slice();const role=rk?ROLES.find(r=>r.k===rk):pick(ROLES.filter(r=>!['manager','opsmgr','asstmgr'].includes(r.k)||Math.random()<0.25));const ib=Math.round((S.integrity-50)/4)+(has('o_recruit')?12:0)+tierN('rc',2)*6;R[0]+=ib;R[1]+=ib;const sk={};CATS.forEach(c=>sk[c.k]=ri(Math.round(R[0]*0.7),Math.round(R[1]*0.85)));sk[role.m]=ri(R[0]+15,R[1]+5);
 const avg=Object.values(sk).reduce((a,b)=>a+b,0)/5;const iq=clamp(ri(3+t,6+t),1,10);const c=persona({id:0,name:pick(FIRST)+' '+pick(LAST),role:role.n,sk,iq,salary:0,av:avatarRand(),train:null});if(hasT(c,'diva'))c.sk[role.m]+=15;c.salary=expectedSal(c);c.rk=role.k;if(['manager','opsmgr','asstmgr'].includes(role.k)){c[role.k==='opsmgr'?'opsMgr':'mgr']=true;c.lead=Math.round(clamp(ri(R[0]+20,R[1]+25),40,220)*(role.k==='asstmgr'?0.75:1));c.salary+=Math.round(c.lead*22/100)*100}c.task='idle';return c}
function recruit(t){const T=RTIERS[t];if(S.money<T[1])return;spend(T[1]);S.cands=[0,1,2].map(()=>genCand(T[2],S.hireRole||null));render();renderHud()}
function hire(i){if(S.staff.length-1>=hireCap())return modal('Office full',`<p>Your ${OFFICES[S.office].n} fits ${hireCap()} hires. Upgrade it from 🏗️ Facility on the Branch screen.</p>`);const c=S.cands[i];c.id=S.nid++;c.hiredW=S.week;c.task=ROLE_TASK[c.rk]||'idle';S.staff.forEach(o=>relAdd(c.id,o.id,rnd(-10,15)));S.staff.push(c);S.cands=null;news('🤝 Hired '+c.name+' ('+c.role+')');save();render()}
function fire(id){const s=S.staff.find(x=>x.id===id);modal('Let go?',`<p>Let ${esc(s.name)} go? You pay one month of salary as severance (${$m(s.salary)}).</p>`,[{t:'Cancel',c:'sec'},{t:'Let go',c:'bad',f:()=>{spend(s.salary);S.staff=S.staff.filter(x=>x.id!==id)}}])}
function trainCost(s,c){return Math.round((10e3+s.sk[c]*350)/1000)*1000}
function train(id,c){const s=S.staff.find(x=>x.id===id);const cost=trainCost(s,c);if(S.money<cost||s.train)return;spend(cost);s.train={c,until:S.week+3};news('📚 '+s.name+' started '+CATS.find(x=>x.k===c).n+' training');render();renderHud()}

  let best=null,bd=4;M.segs.forEach(s=>{const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1];const t=clamp(((fx_-s.a[0])*dx+(fy_-s.a[1])*dy)/(dx*dx+dy*dy),0,1);const p=[s.a[0]+dx*t,s.a[1]+dy*t];const d=Math.hypot(p[0]-fx_,p[1]-fy_);if(d<bd){bd=d;best=p}});
  if(!best){mgSfx('deny');return}M.posts.push(best);mgSfx('ping');this.draw(M)},
 finish(M){const used=new Set();let hits=0;M.req.forEach(q=>{let bi=-1,bd=2.2;M.posts.forEach((p,i)=>{if(used.has(i))return;const d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<bd){bd=d;bi=i}});if(bi>=0){used.add(bi);hits++}});const ex=M.posts.length-hits;M.show=true;this.draw(M);

/* ===== P20: assistant / operations manager scouts and pitches hires ===== */
const SCOUT_RK=['asstmgr','opsmgr'];
function scout(){return S.staff.filter(s=>!s.founder&&SCOUT_RK.includes(s.rk)&&!s.vac).sort((a,b)=>leadOf(b)-leadOf(a))[0]||null}
function scoutState(){S.pitch=S.pitch||{on:true,snooze:{},cur:null};return S.pitch}
const RKN=k=>(ROLES.find(r=>r.k===k)||{n:k}).n;const RKA=k=>{const n=RKN(k);return (/^[AEIOU]/i.test(n)?'an ':'a ')+n};
const ROLE_SK={rep:['sales','service'],estimator:['product','sales'],counter:['service','product'],yard:['ops','logistics'],driver:['logistics','ops'],buyer:['ops','product'],manager:['sales','ops'],opsmgr:['ops','logistics'],installer:['product','ops'],asstmgr:['service','ops']};
function scoutNeeds(){const W=S.wk||{},R=[];const waiting=(S.rfqs||[]).filter(r=>!inBid(r.id)).length;
 if((W.tb||0)>0&&fleetNeed()==='driver')R.push({rk:'driver',why:'A truck sat parked with no driver while deliveries got pushed.'});
 if((W.fill==null?1:W.fill)<0.92&&!onTask('buyer').length)R.push({rk:'buyer',why:`We only filled ${pct(W.fill)} of counter demand. Nobody owns the reorders.`});
 if(waiting>3)R.push({rk:'estimator',why:`${waiting} requests for quote are sitting with nobody to bid them.`});
 if((W.rev||0)>45e3&&onTask('counter').length<2)R.push({rk:'counter',why:'The counter is slammed with one person on it.'});
 if(onTask('sales').length<Math.ceil(S.accts.length/15))R.push({rk:'rep',why:'We need more outside sales coverage for this volume.'});
 if(has('b_install')&&typeof installCap==='function'){const bl=S.orders.filter(o=>o.inst).reduce((a,o)=>a+o.left,0);if(bl>Math.max(1,installCap())*4)R.push({rk:'installer',why:'The install backlog is more than a month deep.'})}
 if(S.staff.length>=8&&!onTask('yard').length&&!S.staff.some(s=>s.rk==='yard'))R.push({rk:'yard',why:'The yard has no lead. Loading is slow and stock gets beat up.'});
 return R}
function scoutTake(c,rk){const ks=ROLE_SK[rk]||['sales','ops'];const best=CATS.slice().sort((a,b)=>c.sk[b.k]-c.sk[a.k])[0],worst=CATS.slice().sort((a,b)=>c.sk[a.k]-c.sk[b.k])[0];const fit=ks.reduce((a,k)=>a+c.sk[k],0)/ks.length;
 const lines=[fit>=110?'Strong fit for the job.':fit>=80?'Solid. Will grow into it.':'Green, but cheap and eager.',`Best at ${best.n.toLowerCase()}; weakest at ${worst.n.toLowerCase()}.`];if(c.traits.length)lines.push('Comes across as '+c.traits.map(t=>(TRAITS[t]?TRAITS[t][0]:t).replace(/^[^A-Za-z]+/,'').toLowerCase()).join(' and ')+'.');return lines.join(' ')}
function scoutStart(rk,why,manual){const P=scoutState(),sc=scout();if(!sc)return;const days=Math.max(1,Math.round(3-leadOf(sc)/80));P.cur={rk,why,ready:S.week+days,tries:(P.cur&&P.cur.rk===rk?P.cur.tries:0),by:sc.id,cand:null};
 if(manual){news('🔎 '+sc.name.split(' ')[0]+' is out looking for '+RKA(rk)+'.');save();render()}}
function scoutFind(){const P=scoutState(),sc=scout(),c0=P.cur;if(!sc||!c0)return;const n=2+Math.round(leadOf(sc)/60);const ks=ROLE_SK[c0.rk]||['sales','ops'];
 const mg=['manager','opsmgr','asstmgr'].includes(c0.rk);const cs=[...Array(c0.rec?Math.max(n,4):n)].map(()=>genCand(c0.rec?(mg?3:2):(leadOf(sc)>140?1:0),c0.rk));const c=cs.sort((a,b)=>ks.reduce((x,k)=>x+b.sk[k],0)-ks.reduce((x,k)=>x+a.sk[k],0))[0];c0.cand=c;c0.ready=null;scoutPitch()}
function scoutPitch(){const P=scoutState(),c0=P.cur;if(!c0||!c0.cand)return;const sc=S.staff.find(s=>s.id===c0.by)||scout();if(!sc)return;const c=c0.cand;
 const fee=recFee(c0.rk,c);modal(c0.rec?'🎯 The recruiter found '+esc(RKA(c0.rk)):'🧑‍💼 '+esc(sc.name.split(' ')[0])+' found '+esc(RKA(c0.rk)),`<div class="staff" style="margin-bottom:6px">${avatar(sc.av,40)}<div class="small" style="flex:1"><b>${esc(sc.name)}</b> · ${esc(RKN(sc.rk))}<br><span class="mut">"${c0.rec?'This one came through the recruiter. Fee\'s already paid, so it\'s your call.':esc(c0.why)}"</span></div></div>
  <div class="staff">${avatar(c.av,56)}<div style="flex:1"><div class="between"><b>${esc(c.name)}</b><span class="small">${$m(c.salary)}/mo</span></div><div class="mut small">${esc(c.role)} · ${c.age}, ${esc(c.town)}</div><div class="small" style="font-style:italic">"${esc(c.bio)}"</div><div>${c.traits.map(t=>`<span class="trait">${TRAITS[t][0]}</span>`).join('')}</div><div class="skills" style="margin-top:4px">${CATS.map(x=>`<div><b style="color:var(--${x.k})">${c.sk[x.k]}</b>${x.n}</div>`).join('')}</div></div></div>
  <p class="small" style="margin-top:6px">💬 <b>${esc(sc.name.split(' ')[0])}'s take:</b> ${esc(scoutTake(c,c0.rk))}</p>${!roomFor(c0.rk)?'<p class="bad small">'+(isField(c0.rk)?'The crew room is full. Add lockers or a bigger yard.':'No open desk. Add a second-story office or move.')+'</p>':''}`,
  [{t:'Hire '+c.name.split(' ')[0],c:'good',f:()=>scoutHire()},...(c0.rec?[]:[{t:'Use our recruiters ('+$m(fee)+')<br><small style="font-weight:500;opacity:.8">'+(['manager','opsmgr','asstmgr'].includes(c0.rk)?'Executive search':'Industry recruiter')+': stronger candidates, 1–2 weeks</small>',c:'sec',f:()=>scoutRecruit(fee)}]),{t:'Keep searching',c:'sec',f:()=>scoutMore()},{t:'Not now',c:'sec',f:()=>scoutDrop()}])}
// recruiter fee: a cut of first-year pay, like the real thing (more for leadership searches)
function recFee(rk,c){const mg=['manager','opsmgr','asstmgr'].includes(rk);const base=(c&&c.salary?c.salary:4000)*12;return Math.max(2500,Math.round(base*(mg?0.3:0.2)/500)*500)}
function scoutRecruit(fee){const P=scoutState(),c0=P.cur;if(!c0)return;if(S.money<fee){modal('Not enough cash','<p>The recruiter wants '+$m(fee)+' up front.</p>');return}spend(fee);c0.rec=1;c0.cand=null;c0.ready=S.week+ri(1,2);news('🎯 Hired a recruiter to find '+RKA(c0.rk)+' ('+$m(fee)+').');save();render()}
function scoutHire(){const P=scoutState(),c0=P.cur;if(!c0||!c0.cand)return;if(!roomFor(c0.rk)){modal(isField(c0.rk)?'Crew room full':'No open desk',`<p>${isField(c0.rk)?'The yard crew room is full. Add lockers in 🏗️ Facility or move to a bigger yard.':'Every desk is taken. Build a second-story office in 🏗️ Facility, or move.'}</p>`);return}
 S.cands=[c0.cand];hire(0);S.cands=null;news('🤝 Hired '+c0.cand.name+' ('+RKN(c0.rk)+') on '+((S.staff.find(s=>s.id===c0.by)||{name:'your manager'}).name.split(' ')[0])+'\'s pitch.');P.cur=null;save();render()}
function scoutMore(){const P=scoutState(),c0=P.cur,sc=scout();if(!c0||!sc)return;c0.tries++;c0.cand=null;if(c0.tries>=3){news('🔎 '+sc.name.split(' ')[0]+': "The market\'s thin for '+RKA(c0.rk)+' right now. I\'ll try again in a couple of months."');P.snooze[c0.rk]=S.week+8;P.cur=null;return}
 c0.ready=S.week+Math.max(1,Math.round(2.5-leadOf(sc)/90));news('🔎 '+sc.name.split(' ')[0]+' is still looking for '+RKA(c0.rk)+'.')}
function scoutDrop(){const P=scoutState(),c0=P.cur;if(!c0)return;P.snooze[c0.rk]=S.week+8;P.cur=null}
function scoutWeek(){if(!S||S.ceo)return;const P=scoutState(),sc=scout();if(!sc||!P.on)return;
 if(P.cur&&!S.staff.find(s=>s.id===P.cur.by))P.cur.by=sc.id;

 const _ts=tutShow;tutShow=function(){_ts.apply(this,arguments);if(lockLeft('bids'))document.querySelectorAll('#tut .tb button').forEach(b=>{if(/Quote my first job/.test(b.textContent))b.textContent='Check the stock'})};
 const _te=tutEnd;tutEnd=function(make){if(make&&lockLeft('bids')){_te(false);go('stock');return}return _te(make)};
 if(typeof GUIDES!=='undefined')GUIDES.forEach(G=>G.steps.forEach(st=>{if(S&&S.ceo)return;if(DK5[st.dk]&&!(G.k==='ceo'))st.dk=DK5[st.dk];if(G.k==='stockout')st.go='stock';if(G.k==='research'){st.go='research';st.h=st.h.replace(/Spend it on/,'Spend it on upgrade packs:')}}))}
addEventListener('DOMContentLoaded',()=>setTimeout(tour5,0));setTimeout(tour5,50);

// ---------- pending decisions survive a reload ----------
// Each choice is dry-run once: run it, record exactly what it changes, then put the game back the way it was.
// The recorded change (numbers as +/-, everything else as the new value) is saved with the inbox and applied if picked later.
const DRY_SKIP={inbx:1,news:0};let DRY=false;
function dryWalk(o,m){if(o===null||typeof o!=='object'||m.has(o))return;m.set(o,Array.isArray(o)?o.slice():Object.assign({},o));(Array.isArray(o)?o:Object.keys(o).filter(k=>!DRY_SKIP[k]).map(k=>o[k])).forEach(v=>dryWalk(v,m))}
function dryRevert(m){m.forEach((c,o)=>{if(Array.isArray(o)){o.length=0;c.forEach(v=>o.push(v))}else{Object.keys(o).forEach(k=>{if(!(k in c))delete o[k]});Object.assign(o,c)}})}
const ekey=v=>v&&typeof v==='object'&&v.id!=null?'#'+v.id:JSON.stringify(v);
function dDiff(a,b){if(typeof a==='number'&&typeof b==='number')return a===b?undefined:{d:b-a};
 if(a&&b&&typeof a==='object'&&typeof b==='object'){if(Array.isArray(a)&&Array.isArray(b)){const ka=new Map(a.map(v=>[ekey(v),v])),kb=new Map(b.map(v=>[ekey(v),v]));const add=[],del=[],mod={};
   b.forEach((v,i)=>{const k=ekey(v);if(!ka.has(k))add.push([i,v]);else if(k[0]==='#'){const p=dDiff(ka.get(k),v);if(p)mod[k]=p}});a.forEach(v=>{const k=ekey(v);if(!kb.has(k))del.push(k)});
   return add.length||del.length||Object.keys(mod).length?{a:{add,del,mod}}:undefined}
  if(!Array.isArray(a)&&!Array.isArray(b)){const o={};let n=0;new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(DRY_SKIP[k])return;if(!(k in b)){o[k]={x:1};n++}else if(!(k in a)){o[k]={v:b[k]};n++}else{const p=dDiff(a[k],b[k]);if(p){o[k]=p;n++}}});return n?{o}:undefined}}
 return JSON.stringify(a)===JSON.stringify(b)?undefined:{v:b}}
function dApply(t,p){if(p.o){Object.keys(p.o).forEach(k=>{const q=p.o[k];if(q.x)delete t[k];else if('v' in q)t[k]=JSON.parse(JSON.stringify(q.v));else if('d' in q)t[k]=(typeof t[k]==='number'?t[k]:0)+q.d;else if(t[k]&&typeof t[k]==='object')dApply(t[k],q);else if(q.a)t[k]=q.a.add.map(x=>x[1])});return}
 if(p.a&&Array.isArray(t)){const A=p.a;Object.keys(A.mod).forEach(k=>{const e=t.find(v=>ekey(v)===k);if(e)dApply(e,A.mod[k])});A.del.forEach(k=>{const i=t.findIndex(v=>ekey(v)===k);if(i>=0)t.splice(i,1)});A.add.forEach(([i,v])=>{if(!t.some(x=>ekey(x)===ekey(v)))t.splice(Math.min(i,t.length),0,JSON.parse(JSON.stringify(v)))})}}
function dryRun(f){if(!f)return {p:null,m:[]};const m=new Map();dryWalk(S,m);const before=JSON.parse(JSON.stringify(S,(k,v)=>DRY_SKIP[k]?undefined:v));const ms=[];
 const sv={modal,modalFirst,render,renderHud,save,go,setSpeed,showModal,sfx:window.sfx};modal=(t,h)=>ms.push([t,h]);modalFirst=modal;render=renderHud=save=go=setSpeed=showModal=()=>{};window.sfx=()=>{};DRY=true;let p=null;
 try{f();p=dDiff(before,JSON.parse(JSON.stringify(S,(k,v)=>DRY_SKIP[k]?undefined:v)))||null}catch(e){console.error('dry',e)}finally{DRY=false;Object.assign(window,{});modal=sv.modal;modalFirst=sv.modalFirst;render=sv.render;renderHud=sv.renderHud;save=sv.save;go=sv.go;setSpeed=sv.setSpeed;showModal=sv.showModal;window.sfx=sv.sfx;dryRevert(m)}
 return {p,m:ms}}
function inbPack(it){if(!it.rec){it.rec=it.btns.map(b=>{const g=b.go||null;if(it.info||!b.f)return {t:b.t,c:b.c,go:g};const r=dryRun(b.f);return {t:b.t,c:b.c,p:r.p,m:r.m,go:g}})}
 return {title:it.title,html:it.html,w:it.w,info:it.info,digest:it.digest,btns:it.rec}}
function inbUnpack(r){return {id:INB_ID++,title:r.title,html:r.html,w:r.w,info:r.info,digest:r.digest,rec:r.btns,btns:r.btns.map(b=>({t:b.t,c:b.c,go:b.go,f:()=>{if(b.p)dApply(S,b.p);(b.m||[]).forEach(([t,h])=>modal(t,h));if(b.go)setTimeout(()=>go(b.go),0)}}))}}
{const _svI=save;save=function(){if(S&&!DRY){try{S.inbx=INBOX.map(inbPack)}catch(e){console.error(e)}}return _svI.apply(this,arguments)}}
{const _ldI=load;load=function(){const r=_ldI.apply(this,arguments);try{if(r&&S&&S.inbx){INBOX=S.inbx.map(inbUnpack)}else INBOX=[]}catch(e){console.error(e);INBOX=[]}return r}}

if(typeof document!=='undefined'&&document.getElementById('main'))addEventListener('DOMContentLoaded',boot);
</script>

<div id="tut"><div class="hole none"></div><div class="tb"></div></div>
<script>
/* ===== Tutorial ===== */
const TUT=[
 {t:()=>`Welcome to ${esc(S.founder.studio)}!`,h:()=>`<p>It's March 2000, the first week of your fiscal year. You have a rented lot, a pickup truck and some stock. Your goal: become the region's go-to fence and deck supplier.</p><p>This quick tour takes about a minute. The game is paused while you look around.</p>`},
 {sel:'#hud .res',t:()=>'Your numbers',h:()=>`<ul><li>💵 <b>Money</b>: pays wages, rent, stock and trucks.</li><li>⭐ <b>Reputation</b>: how many contractors know and trust you. More counter traffic and more bids.</li><li>🧠 <b>Know-how</b>: spend it on upgrades.</li><li>🙂 <b>Integrity</b>: tough calls raise or lower it.</li></ul>`},
 {sel:'#hud .spd',t:()=>'Time controls',h:()=>`<p>Pause, play, or fast-forward. Spring and summer are peak season. Winter is slow, a good time to rest the crew and stock up when prices dip.</p><p>Tap 🔊 to turn the music and sound on or off.</p>`},
 {sel:'#officeWrap',office:1,t:()=>'Your branch',h:()=>`<p>This is your branch. Stock lives out back in the fenced yard, and the stacks grow as you buy. Tap anyone to see their profile.</p><p>Drag to rotate the view, pinch to zoom.</p>`},
 {dock:0,t:()=>'🏢 Branch',h:()=>`<p>Last week's sales, your pipeline of bids and orders, and <b>who's doing what</b>. Everyone gets a job: counter, outside sales, yard, delivery, training or rest.</p>`},
 {dock:1,t:()=>'👥 People',h:()=>`<p>Hire counter staff, estimators, drivers, yard leads and reps. Everyone has skills, traits, morale, energy and friendships.</p><p>Run people too hard in peak season and they burn out.</p>`},
 {dock:2,t:()=>'📝 Bid',h:()=>`<p>Contractors, homeowners and ranches send requests for quotes. Pick the grade, sourcing, extras, margin, delivery and terms. Win, and the order lands on your board.</p>`},
 {dock:3,t:()=>'📦 Stock',h:()=>`<p>Your counter only sells what's in the yard. Buy when lumber and steel prices dip, set margins and targets, and restock everything in one tap.</p>`},
 {dock:4,t:()=>'🧠 Upgrades',h:()=>`<p>New product lines, new customer types, services, trucks, yard equipment and business moves. A badge shows when something is ready.</p>`},
 {dock:5,t:()=>'💼 Business',h:()=>`<p>Fiscal-year results, customer accounts, your fleet, the bank, and how you stack up against rival suppliers.</p>`},
 {t:()=>'How to run a great yard',h:()=>`<ul><li>Keep your best-selling lines <b>in stock</b>. Empty bins send customers to rivals.</li><li>Every truck needs someone on <b>🚚 Delivery</b>.</li><li>Each customer type values price, stock, speed, quality and service differently. <b>Bid scorecards</b> teach you what they want.</li><li>Watch <b>commodity prices</b>. Cheap stock sold at today's price is pure margin.</li></ul>`,last:1}
];
let TI=-1,TPREV=1;
function startTutorial(replay){if(!S)return;MQ.length=0;showModal();TPREV=replay?(S.paused?0:S.speed):1;S.paused=true;S.speed=0;startTimer();renderHud();if(replay){S.tutOff=false;go('studio')}TI=0;document.getElementById('tut').classList.add('on');tutShow();try{sfx&&sfx('click')}catch(e){}}
function tutEnd(make){const el=document.getElementById('tut');el.classList.remove('on');TI=-1;S.tutDone=1;setSpeed(TPREV||1);save();if(make){go('create')}}
function tutGo(d){TI+=d;if(TI<0)TI=0;if(TI>=TUT.length)return tutEnd(false);tutShow()}
function tutTarget(st){if(st.dock!=null)return document.querySelectorAll('#dock .dk')[st.dock];if(st.sel)return document.querySelector(st.sel);return null}
function tutShow(){const st=TUT[TI];if(!st)return;const root=document.getElementById('tut');const hole=root.querySelector('.hole');const tb=root.querySelector('.tb');
 const el=tutTarget(st);let r=null;
 if(el){const b=el.getBoundingClientRect();if(st.office){const hud=document.getElementById('hud').getBoundingClientRect();const dk=document.getElementById('dock').getBoundingClientRect();const top=hud.bottom+12,bot=dk.top-12;r={left:12,top,width:innerWidth-24,height:Math.max(80,bot-top)}}else{const p=6;r={left:b.left-p,top:b.top-p,width:b.width+p*2,height:b.height+p*2}}}
 if(r){hole.classList.remove('none');Object.assign(hole.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'})}else{hole.classList.add('none');Object.assign(hole.style,{left:innerWidth/2+'px',top:innerHeight/2+'px'})}
 const n=TUT.length;
 tb.innerHTML=`<h3>${st.t()}</h3>${st.h()}<div class="tbf"><div class="dots">${TUT.map((_,i)=>`<i class="${i===TI?'on':''}"></i>`).join('')}</div><div class="row" style="gap:6px;margin:0">${st.last?`<button class="btn sec sm" onclick="tutEnd(false)">Explore first</button><button class="btn sm" onclick="tutEnd(true)">Quote my first job</button>`:`${TI?`<button class="btn sec sm" onclick="tutGo(-1)">Back</button>`:`<button class="skip" onclick="tutEnd(false)">Skip tour</button>`}<button class="btn sm" onclick="tutGo(1)">${TI?'Next':'Show me around'}</button>`}</div></div>`;
 // place bubble: below target if room, else above, else centered
 const th=tb.offsetHeight||220;let top;
 if(!r)top=(innerHeight-th)/2;else if(st.office)top=r.top+r.height-th-10;else if(r.top+r.height+12+th<innerHeight-8)top=r.top+r.height+12;else top=Math.max(8,r.top-th-12);
 tb.style.top=Math.max(8,Math.min(innerHeight-th-8,top))+'px'}
addEventListener('resize',()=>{if(TI>=0)tutShow()});
const TIPS=[
 `<b class="h">Tip:</b> Start with jobs you can fill <b>from stock</b>. Green "In stock" means you can ship next week, and contractors love that.`,
 `<b class="h">Tip:</b> The takeoff team leaves their usual post while they bid. One or two people is plenty for a small job. Check the deadline!`,
 `<b class="h">Tip:</b> <b>Standard grade from your yard</b> is a safe first bid. After your first bid with a customer type, extras that impress them get a <b>fits ✓</b> label.`,
 `<b class="h">Tip:</b> Margin is your big lever. Stay near the typical market margin to start. Pros like Net 30 terms; homeowners don't care.`,
 `<b class="h">Tip:</b> Before you win, make sure someone is on <b>🚚 Delivery</b> so the truck can roll.`];
function tutTip(i){if(!S||S.tutOff||S.jobs.length)return'';return `<div class="card tip">${TIPS[i]||''} <button class="skip" style="background:none;border:none;color:var(--mut);font-weight:700;font-size:12px" onclick="S.tutOff=true;save();render()">Hide tips</button></div>`}
